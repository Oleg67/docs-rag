[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docs-rag"
version = "0.1.0"
description = "Local RAG over crawled web pages and local documents, served as an MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "mcp>=2.3",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "PyStemmer>=2.2",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
docs-rag = "docs_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
